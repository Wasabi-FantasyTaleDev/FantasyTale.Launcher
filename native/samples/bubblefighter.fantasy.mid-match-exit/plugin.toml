schema = 1

[plugin]
id = "bubblefighter.fantasy.mid-match-exit"
version = "0.1.4"
game = "bubblefighter"
kind = "patch"
runtime = ">=3.0.0"
authors = ["Fantasy Tale Studio"]
license = "MIT"

[plugin.name]
en = "Leave an ongoing match"
"zh-CN" = "ESC 提前离场"
"zh-TW" = "ESC 提前離場"
ko = "진행 중인 경기 나가기"
id = "Keluar dari pertandingan"
vi = "Thoát trận đang diễn ra"

[plugin.description]
"en" = "Press ESC during a game to return directly to the plaza."
"zh-CN" = "游戏过程中按下ESC可直接返回广场。"
"zh-TW" = "遊戲過程中按下ESC可直接返回廣場。"
"ko" = "게임 중 ESC를 눌러 광장으로 바로 돌아갈 수 있습니다."
"id" = "Tekan ESC selama permainan untuk langsung kembali ke plaza."
"vi" = "Nhấn ESC trong trò chơi để trở về quảng trường ngay."

[compatibility]
builds = ["kr-812"]

[[options]]
key = "all_modes"
type = "bool"
default = false
[options.label]
en = "Allow all modes"
"zh-CN" = "允许所有模式"
"zh-TW" = "允許所有模式"
ko = "모든 모드 허용"
id = "Izinkan semua mode"
vi = "Cho phép mọi chế độ"
[options.description]
en = "Off preserves original rules. On removes mode restrictions while retaining initialization, connection and duplicate-dialog guards."
"zh-CN" = "关闭时按原版规则；开启时放开模式限制，保留初始化、连接和防重复弹窗检查。"
"zh-TW" = "關閉時按原版規則；開啟時放開模式限制，保留初始化、連線和防重複彈窗檢查。"
ko = "끄면 기존 규칙을 유지합니다. 켜면 초기화, 연결, 중복 창 검사를 유지하면서 모드 제한을 해제합니다."
id = "Nonaktif mempertahankan aturan asli. Aktif menghapus batasan mode, dengan pemeriksaan inisialisasi, koneksi, dan dialog ganda."
vi = "Tắt giữ quy tắc gốc. Bật bỏ giới hạn chế độ nhưng giữ kiểm tra khởi tạo, kết nối và hộp thoại trùng."

# kr-812 sub_668A60: remove only predicates preceding the configured exit-key
# comparison; the stage-ready, active-context and reentrancy checks remain.
[[patches]]
id = "exit-mode-flags"
builds = ["kr-812"]
when = "all_modes"
locate = { rva = 0x268AD9 }
expect = "0F 84 F2 04 00 00"
write = "90 90 90 90 90 90"

[[patches]]
id = "exit-mode-list"
builds = ["kr-812"]
when = "all_modes"
locate = { rva = 0x268AE6 }
expect = "0F 84 E5 04 00 00"
write = "90 90 90 90 90 90"

[[patches]]
id = "exit-mode-101"
builds = ["kr-812"]
when = "all_modes"
locate = { rva = 0x268AF5 }
expect = "0F 84 D6 04 00 00"
write = "90 90 90 90 90 90"

# kr-812 sub_529D90 detects ChrZombieBoss objects; preserve the preceding
# availability check while allowing the existing confirmation in boss matches.
[[patches]]
id = "exit-boss-presence"
builds = ["kr-812"]
when = "all_modes"
locate = { rva = 0x268B67 }
expect = "0F 85 50 04 00 00"
write = "90 90 90 90 90 90"

# kr-812 sub_896B60: retain the client's original confirmation and relay path.
# The game-connection fallback is intentionally not enabled until its post-leave
# state transition is proven on this build.
[[patches]]
id = "confirmed-exit-policy"
builds = ["kr-812"]
when = "all_modes"
locate = { rva = 0x496BF0 }
expect = "74 2D"
write = "90 90"
