when = "auto_dash"
locate = { pattern = "E8 77 18 36 00 84 C0 74 3D 8D BE FC A9 00 00 8B CF E8 66 DE 38 00 84 C0 74 20 8B 16 8B 82 A4 02 00 00 8B CE FF D0 84 C0 75 1C E8 7D 5E 00 00 84 C0 74 13 E8 84 50 00 00 EB 0C 68 2C 01 00 00 8B CF E8 86 DD 38 00 8B 0D A4 7D C0 00 6A", offset = 24 }
