schema = 1

[plugin]
id = "bubblefighter.fantasy.auto-dash"
version = "0.2.2"
game = "bubblefighter"
kind = "native"
runtime = ">=3.0.0 <4.0.0"
authors = ["Fantasy Tale Studio"]
license = "MIT"

[plugin.name]
en = "Auto Dash"
"zh-CN" = "一键跑步"
"zh-TW" = "一鍵跑步"
ko = "간편 대시"
id = "Lari Otomatis"
vi = "Chạy tự động"

[plugin.description]
"zh-CN" = "只需按一次w即可触发跑步效果。"
"zh-TW" = "只需按一次w即可觸發跑步效果。"
"en" = "Press W once to start running."
"ko" = "W 키를 한 번만 누르면 달리기가 시작됩니다."
"id" = "Tekan W sekali untuk mulai berlari."
"vi" = "Chỉ cần nhấn W một lần để bắt đầu chạy."
"th" = "กด W เพียงครั้งเดียวเพื่อเริ่มวิ่ง"

[compatibility]
builds = ["kr-812", "cn-279", "cn-324", "cn-406", "cn-404", "cn-706", "cn-717", "cn-735", "id-400", "id-1809", "tw-454"]
# KR1256 already provides native one-press running.
exclude = ["kr-1256"]

[native]
library = "auto_dash.dll"
entry = "fthook_plugin_main"

[[options]]
key = "auto_dash"
type = "bool"
default = true
[options.label]
en = "Run with one press"
"zh-CN" = "单次按键跑步"
"zh-TW" = "單次按鍵跑步"
ko = "한 번 눌러 대시"
id = "Berlari dengan satu tekanan"
vi = "Chạy bằng một lần nhấn"
[options.description]
en = "Changing this setting takes effect on the next game launch."
"zh-CN" = "修改后下次启动游戏生效。"
"zh-TW" = "修改後下次啟動遊戲生效。"
ko = "변경 사항은 다음 게임 실행 시 적용됩니다."
id = "Perubahan berlaku saat permainan dijalankan kembali."
vi = "Thay đổi có hiệu lực vào lần khởi chạy trò chơi tiếp theo."

# kr-812 sub_5DBA00 at 0x5DBDF8: bypass only the double-press timer gate.
# Keep the configured forward-key check and sub_5E1750 movement guards intact.
[[patches]]
id = "forward-double-press-gate"
builds = ["kr-812"]
when = "auto_dash"
locate = { pattern = "8B 8F 04 B3 00 00 8D 49 18 E8 8A 3F 48 00 84 C0 ?? ?? 8B 17 8B 82 0C 03 00 00 8B CF FF D0 84 C0 75 26 8B F7 E8 3F 59 00 00 84 C0 74 1B 57 E8 35 4C 00 00 EB 13", offset = 16 }
expect = "74 23"
write = "90 90"

