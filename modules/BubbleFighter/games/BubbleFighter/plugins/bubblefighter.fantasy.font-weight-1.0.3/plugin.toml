schema = 1

[plugin]
id = "bubblefighter.fantasy.font-weight"
version = "1.0.3"
game = "bubblefighter"
kind = "patch"
runtime = ">=3.0.0"
authors = ["Fantasy Tale Studio"]
license = "MIT"

[plugin.name]
"en" = "Chinese font weight fix"
"zh-CN" = "中文字重修复"
"zh-TW" = "中文字重修復"
"ko" = "중국어 글꼴 굵기 수정"
"id" = "Perbaikan ketebalan huruf Mandarin"
"vi" = "Sửa độ đậm phông chữ tiếng Trung"

[plugin.description]
"en" = "Fixes thin Chinese text after localization to match the Chinese client."
"zh-CN" = "修复汉化后中文字体显得很细，与国服表现不一致的问题。"
"zh-TW" = "修復漢化後中文字體顯得很細，與中國版本表現不一致的問題。"
"ko" = "중국어 번역 후 글꼴이 중국 클라이언트보다 가늘게 표시되는 문제를 수정합니다."
"id" = "Memperbaiki teks Mandarin yang terlalu tipis setelah lokalisasi agar sesuai dengan klien Tiongkok."
"vi" = "Sửa chữ tiếng Trung quá mảnh sau khi dịch để giống máy khách Trung Quốc."

[compatibility]
# Only builds with a unique, verified language-group gate are offered.
builds = ["id-400", "id-1809", "kr-812"]
exclude = ["branch:cn"]

[[options]]
key = "force_bold"
type = "bool"
default = true
[options.label]
en = "Use bold font weight"
"zh-CN" = "使用粗体字重"
"zh-TW" = "使用粗體字重"
ko = "굵은 글꼴 사용"
id = "Gunakan huruf tebal"
vi = "Sử dụng chữ đậm"

# The two NOPs retain the client's existing weight store, without replacing font resources.
[[patches]]
id = "language-group-gate"
when = "force_bold"
locate = { pattern = "83 3D ?? ?? ?? ?? 02 75 03 89 ?? 3C", offset = 7 }
expect = "75 03"
write = "90 90"
