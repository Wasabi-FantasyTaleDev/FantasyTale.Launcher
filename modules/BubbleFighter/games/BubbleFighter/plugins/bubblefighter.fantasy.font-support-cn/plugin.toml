schema = 1

[plugin]
minimum_launcher_version = "0.1.68"
id = "bubblefighter.fantasy.font-support-cn"
aliases = ["bubblefighter.fantasy.font-weight"]
version = "1.0.10"
game = "bubblefighter"
kind = "files"
runtime = ">=3.7.3 <4.0.0"
authors = ["Fantasy Tale Studio"]
license = "MIT"

[plugin.name]
"en" = "Chinese font support"
"zh-CN" = "中文字体支持"
"zh-TW" = "中文字體支援"
"ko" = "중국어 글꼴 지원"
"id" = "Dukungan font Mandarin"
"vi" = "Hỗ trợ phông chữ tiếng Trung"

[plugin.description]
"zh-CN" = "安装后可在非国服版本中正常显示汉字。"
"zh-TW" = "安裝後可在非中國版本中正常顯示漢字。"
"en" = "Displays Chinese characters correctly in non-Chinese client versions."
"ko" = "중국 이외 지역의 클라이언트에서도 한자를 올바르게 표시합니다."
"id" = "Menampilkan karakter Mandarin dengan benar pada versi klien non-Tiongkok."
"vi" = "Hiển thị đúng chữ Hán trong các phiên bản máy khách ngoài Trung Quốc."
"th" = "แสดงอักษรจีนได้อย่างถูกต้องในไคลเอนต์เวอร์ชันนอกประเทศจีน"

[compatibility]
# Supported native font tables and the optional Chinese weight gate are verified.
builds = ["id-400", "id-1809", "kr-812", "kr-1256"]
exclude = ["branch:cn"]

[[options]]
key = "force_bold"
type = "bool"
default = false
[options.label]
en = "Use bold font weight"
"zh-CN" = "使用粗体字重"
"zh-TW" = "使用粗體字重"
ko = "굵은 글꼴 사용"
id = "Gunakan huruf tebal"
vi = "Sử dụng chữ đậm"

[[files]]
source = "fonts/chinese-korean.ttf"
target = "Data/ngulim.ttf"
size = 29354516
sha256 = "ab6ca4f5ac9a0a97b75fc1e03f9f021bb0311cccadda89f6ed810d273f902506"

# kr-812 sub_AE60D0 selects Fonts_kr.csv and loads each fileName under Data/.
# Available originals retain their own Korean glyphs; absent originals use the complete fallback.
exclude_client_languages = ["zh", "zh-CN", "zh-TW", "zh-Hans", "zh-Hant"]

