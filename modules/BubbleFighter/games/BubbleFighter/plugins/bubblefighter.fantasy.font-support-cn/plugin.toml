# kr-1256 sub_1052710 normalizes weights to 400/700 at style +56; retain its store and normalize to 700.
[[patches]]
id = "optional-non-chinese-weight"
builds = ["id-400", "id-1809", "kr-812"]
exclude_client_languages = ["zh", "zh-CN", "zh-TW", "zh-Hans", "zh-Hant"]
when = "force_bold"
locate = { pattern = "83 3D ?? ?? ?? ?? 02 75 03 89 ?? 3C", offset = 7 }
expect = "75 03"
write = "90 90"

# kr-812 sub_AE3E50: repair the Chinese language weight store independently of the optional override.
[[patches]]
id = "chinese-weight-repair"
builds = ["id-400", "id-1809", "kr-812"]
client_languages = ["zh", "zh-CN", "zh-TW", "zh-Hans", "zh-Hant"]
locate = { pattern = "83 3D ?? ?? ?? ?? 02 75 03 89 ?? 3C", offset = 7 }
expect = "75 03"
write = "90 90"

# kr-1256 sub_1051C20 loads the Korean table; its Default rows select this font.
[[patches]]
id = "modern-chinese-weight"
builds = ["kr-1256"]
client_languages = ["zh", "zh-CN", "zh-TW", "zh-Hans", "zh-Hant"]
locate = { pattern = "B8 90 01 00 00 81 FB BC 02 00 00 0F 45 D8 B0 01 5F 89 5E 38", offset = 1 }
expect = "90 01 00 00"
write = "BC 02 00 00"

# kr-1256 sub_1052710 normalizes weights to 400/700 at style +56; retain its store and normalize to 700.
[[patches]]
id = "modern-optional-weight"
builds = ["kr-1256"]
when = "force_bold"
exclude_client_languages = ["zh", "zh-CN", "zh-TW", "zh-Hans", "zh-Hant"]
locate = { pattern = "B8 90 01 00 00 81 FB BC 02 00 00 0F 45 D8 B0 01 5F 89 5E 38", offset = 1 }
expect = "90 01 00 00"
write = "BC 02 00 00"
