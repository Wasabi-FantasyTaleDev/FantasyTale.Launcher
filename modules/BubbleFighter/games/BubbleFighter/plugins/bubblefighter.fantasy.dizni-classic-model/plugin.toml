schema = 1

[plugin]
id = "bubblefighter.fantasy.dizni-classic-model"
version = "1.0.1"
game = "bubblefighter"
kind = "files"
minimum_launcher_version = "0.1.33"
restore_files = true
update_source = "fantasy-tale"
authors = ["Fantasy Tale Studio"]

[plugin.name]
"en" = "Classic Dizni model"
"zh-CN" = "旧版黑妞模型"
"zh-TW" = "舊版痞子妹模型"
"ko" = "디지니 구형 모델"
"id" = "Model klasik Dizni"
"vi" = "Mô hình cổ điển Dizni"

[plugin.description]
"en" = "Use the classic Dizni model with matching facial expressions and available classic animations. Original resources are restored after the game exits."
"zh-CN" = "使用黑妞重做前的模型、配套表情及已有旧版动作，游戏退出后自动还原原文件。"
"zh-TW" = "使用痞子妹重製前的模型、配套表情及既有舊版動作，遊戲結束後自動還原原始檔案。"
"ko" = "디지니의 구형 모델과 그에 맞는 표정 및 기존 구형 동작을 사용합니다. 게임 종료 후 원본 파일이 자동으로 복원됩니다."
"id" = "Gunakan model klasik Dizni beserta ekspresi wajah dan animasi klasik yang tersedia. Berkas asli dipulihkan setelah game ditutup."
"vi" = "Sử dụng mô hình Dizni cổ điển cùng biểu cảm và hoạt ảnh cổ điển có sẵn. Tệp gốc được khôi phục sau khi thoát trò chơi."

[compatibility]
builds = ["cn-0-92-1", "cn-774", "tw-454", "kr-1256"]

