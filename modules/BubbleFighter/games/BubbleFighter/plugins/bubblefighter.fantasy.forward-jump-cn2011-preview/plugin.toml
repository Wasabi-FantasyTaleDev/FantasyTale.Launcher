schema = 1

[plugin]
id = "bubblefighter.fantasy.forward-jump-cn2011-preview"
version = "0.1.0"
game = "bubblefighter"
kind = "native"
runtime = ">=3.0.0 <4.0.0"
authors = ["Fantasy Tale Studio"]
license = "MIT"

[plugin.name]
en = "Forward Jump"
"zh-CN" = "前进起跳"
"zh-TW" = "前進起跳"
ko = "전진 점프"
id = "Lompat Maju"
vi = "Nhảy tiến"

[plugin.description]
en = "For the CN2011 client, prefer a forward jump when W is held with Space instead of falling back to a roll."
"zh-CN" = "为旧版适配w键时优先起跳而非翻滚的功能"
"zh-TW" = "為舊版適配W鍵時優先起跳而非翻滾的功能"
ko = "CN2011 클라이언트에서 W와 스페이스를 함께 누르면 구르기 대신 전방 점프를 우선합니다."
id = "Untuk klien CN2011, dahulukan lompatan maju saat W dan Spasi ditekan daripada berguling."
vi = "Với máy khách CN2011, ưu tiên nhảy về phía trước khi giữ W và nhấn Space thay vì lăn."

[compatibility]
builds = ["cn-279"]

[[options]]
key = "forward_jump"
type = "bool"
default = true
[options.label]
en = "Prefer forward jump"
"zh-CN" = "优先前进起跳"
"zh-TW" = "優先前進起跳"
ko = "전방 점프 우선"
id = "Dahulukan lompatan maju"
vi = "Ưu tiên nhảy tiến"
[options.description]
en = "Changes take effect on the next game launch. Other movement and action checks remain active."
"zh-CN" = "修改后下次启动游戏生效，其他移动和动作判定仍然保留。"
"zh-TW" = "修改後下次啟動遊戲生效，其他移動和動作判定仍然保留。"
ko = "변경 사항은 다음 게임 실행 시 적용되며 다른 이동 및 동작 조건은 유지됩니다."
id = "Perubahan berlaku saat permainan dijalankan kembali dan pemeriksaan gerakan lainnya tetap aktif."
vi = "Thay đổi có hiệu lực ở lần chạy tiếp theo và các điều kiện di chuyển khác vẫn được giữ nguyên."


[native]
library = "forward_jump.dll"
