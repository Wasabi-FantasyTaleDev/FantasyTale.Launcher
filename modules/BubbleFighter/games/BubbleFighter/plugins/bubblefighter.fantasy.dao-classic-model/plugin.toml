schema = 1

[plugin]
id = "bubblefighter.fantasy.dao-classic-model"
version = "1.0.0"
game = "bubblefighter"
kind = "files"
minimum_launcher_version = "0.1.33"
restore_files = true
update_source = "fantasy-tale"
authors = ["Fantasy Tale Studio"]

[plugin.name]
"en" = "Classic Dao model"
"zh-CN" = "旧版皮蛋模型"
"zh-TW" = "舊版藍寶模型"
"ko" = "다오 구형 모델"
"id" = "Model klasik Dao"
"vi" = "Mô hình cổ điển Dao"

[plugin.description]
"en" = "Use the classic Dao model. Original resources are restored after the game exits."
"zh-CN" = "使用皮蛋重做前的角色模型，游戏退出后自动还原原文件。"
"zh-TW" = "使用藍寶重製前的角色模型，遊戲結束後自動還原原始檔案。"
"ko" = "다오의 리뉴얼 이전 모델을 사용합니다. 게임 종료 후 원본 파일이 자동으로 복원됩니다."
"id" = "Gunakan model klasik Dao. Berkas asli dipulihkan setelah game ditutup."
"vi" = "Sử dụng mô hình Dao trước khi làm lại. Tệp gốc được khôi phục sau khi thoát trò chơi."

[compatibility]
builds = ["cn-0-92-1", "cn-774", "kr-1256"]

