"zh-CN" = "可选的 HTML 游戏内叠加层基础，用于支持该能力的插件。"
"zh-TW" = "可選的 HTML 遊戲內疊加層基礎，用於支援該能力的模組。"
ko = "호환 플러그인을 위한 선택적 HTML 게임 오버레이 기반입니다."
