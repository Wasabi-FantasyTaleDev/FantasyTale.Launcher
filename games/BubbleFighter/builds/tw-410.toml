# Client build definition for the Taiwanese 2013 client.
schema = 1

[build]
id = "tw-410"
game = "bubblefighter"
branch = "tw"
# Signing time (UTC); the PE link time is 2013-01-22 11:21:12 UTC.
build_date = "2013-01-22 11:23:34"
protocol_version = 410
# version.dat [PATCH] VERSION of the client.
patch_version = "227"
executable = "BubbleFighter.exe"
messenger = "standin"
server_profile = "tw-410"
hosting_adapter = "legacy"
default_port = 7270

[build.name]
"en" = "Taiwan 2013-01-22"
"zh-CN" = "台服 2013-01-22"
"zh-TW" = "台灣 2013-01-22"
"ko" = "대만 2013-01-22"
"id" = "Taiwan 2013-01-22"
"vi" = "Đài Loan 2013-01-22"

# The PE header timestamp is the same in packed and unpacked images; image sizes differ.

[fingerprint]
pe_timestamp = 0x50FE7628

[launch]
native_language = "zh-TW"
# tw-410 imports NMCO_CallNMFunc2 and reads its server from login.ini, as kr-812 does.
login = "nmco"
arguments = ["{account}", "/sid=0"]

[plugins]
default = []

[overlay]
theme = "v2"
