# Client build definition (roadmap card L2 formalizes the schema).
schema = 1

[build]
id = "kr-1256"
game = "bubblefighter"
branch = "kr"
build_date = "2026-05-08 16:31:01"
protocol_version = 1256
patch_version = "1304"
executable = "BubbleFighter.exe"
messenger = "standin"                # nmcogame.dll mode: standin | forward
server_profile = "kr-1256"                 # BubbleFighter.Fantasy profile id
hosting_adapter = "modern"
default_port = 7100

[build.name]
"en" = "Korea 2026-05-08"
"zh-CN" = "韩服 2026-05-08"
"zh-TW" = "韓國 2026-05-08"
"ko" = "한국 2026-05-08"
"id" = "Korea 2026-05-08"
"vi" = "Hàn Quốc 2026-05-08"

# The PE header timestamp is the same in packed and unpacked images; image sizes differ.

[fingerprint]
pe_timestamp = 0x69FD90C8

[launch]
native_language = "ko"
login = "hook"                    # gamewidget | nmco | hook
arguments = []

[plugins]
# Plugins installed and enabled for a new instance of this build.
default = ["bubblefighter.fantasy.login-fix-kr"]

[overlay]
theme = "v2"

[[client_policy_rules]]
plugin = "bubblefighter.fantasy.login-fix-kr"
id = "profile-latest"
type = "latest"
builds = ["kr-1256"]


[[client_policy_rules]]
plugin = "bubblefighter.fantasy.login-fix-kr"
id = "profile-require"
type = "require"
builds = ["kr-1256"]


[[client_policy_rules]]
plugin = "bubblefighter.fantasy.shop-unlock"
id = "profile-require"
type = "require"
builds = ["kr-1256"]


[[client_policy_rules]]
plugin = "bubblefighter.fantasy.mid-match-exit"
id = "profile-recommend"
type = "recommend"
builds = ["kr-1256"]
sources = []
default_selected = true


[[client_policy_rules]]
plugin = "bubblefighter.fantasy.font-support-cn"
