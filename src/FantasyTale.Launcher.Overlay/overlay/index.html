<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="/ui-library/game-ui.css">
<script type="importmap">
{
  "imports": {
    "vue": "/ui-library/vue.esm-browser.prod.js"
  }
}
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
  }
  /* Each panel is absolutely positioned; placement is set inline by C# or CSS in the panel itself. */
  .ft-panel {
    position: absolute;
    display: none;
  }
  .ft-panel.visible { display: block; }
  #overlay-backdrop { position:absolute;inset:0;display:none;pointer-events:none; }
</style>
</head>
<body>
<div id="overlay-backdrop" aria-hidden="true"></div>
<script>
  const params = new URLSearchParams(location.search);
  const theme = params.get('theme') ?? 'v2';
  if (!['v1', 'v2', 'v3'].includes(theme)) throw new Error(`Unknown overlay theme: ${theme}`);
  document.documentElement.dataset.ftTheme = theme;
  window.fantasyTaleOverlayTheme = theme;
  // The compiled game UI library is exposed as an optional capability. It is
  // loaded once and stays dormant until a plugin mounts a Vue component; the
  // foundation overlay itself never paints over the game during loading.
  window.fantasyTaleGameUiReady = import('/ui-library/game-ui.js')
    .then(module => { window.fantasyTaleGameUi = module; return module; })
    .catch(error => { window.fantasyTaleGameUiError = String(error); return null; });
</script>
<script type="module">
import { orderedPanels, inputPanels, bringToFront, passesOutsideClicks, subscribePanel } from './panel-stack.js';
import { resolveAnchor } from './anchors.js';
import { waitForNativeSurface } from './surface-ready.js';
/**
 * overlayBus — the communication contract between C# and panel components.
 *
 * C# → page:  postWebMessageAsString(JSON)
 *   { type: "register",   panelId, html?, fileName? }
 *   { type: "unregister", panelId }
 *   { type: "show",       panelId }
 *   { type: "hide",       panelId }
 *   { type: "send",       panelId, name, data }
 *
 * page → C#:  chrome.webview.postMessage(JSON)
 *   { type: "event", panelId, name, data }
 *
 * Panel components → overlayBus:
 *   overlayBus.emit(panelId, name, data)   // send to C#
 *   overlayBus.on(panelId, name, handler)  // receive from C#
 */

const panels = new Map(); // panelId → { host: HTMLElement, shadow: ShadowRoot, listeners: Map }
const backdrop = document.getElementById('overlay-backdrop');
let physicalViewport = { pixelWidth: innerWidth, pixelHeight: innerHeight };
const uiLibrary = Promise.all([import('vue'), import('/ui-library/game-ui.js')])
    .then(([vue, components]) => ({ vue, components }));
const resourceRoot = new URLSearchParams(location.search).get('resources') === 'external'
    ? 'https://resources.fantasytale.local/' : '/resources/';
const localeCatalog = await fetch('/locales.json').then(r => {
    if (!r.ok) throw new Error('Overlay locale catalog is unavailable.');
    return r.json();
});
const requestedLocale = params.get('locale') ?? localeCatalog.default;
const activeLocale = localeCatalog.locales[requestedLocale]?.status === 'ready' ? requestedLocale : localeCatalog.default;
// Panels carry their own labels in every launcher language, so they follow the launcher even where these shell strings fall back.
const panelLocale = localeCatalog.locales[requestedLocale] ? requestedLocale : activeLocale;
document.documentElement.lang = activeLocale;
function translate(key) {
    return localeCatalog.locales[activeLocale].messages[key]
        ?? localeCatalog.locales[localeCatalog.default].messages[key] ?? key;
}

// Custom HTML cues have no assigned assets. Native Vue controls bind their own
// resource-backed player, including the original event gains.
const soundAssets = new Map();
function playSound(panelId, cue) {
    if (!['dialog-open', 'button-press', 'notification'].includes(cue)) return false;
    const source = soundAssets.get(cue);
    if (!source) return false;
    const audio = new Audio(source);
    audio.play().catch(() => {});
    return true;
}

function createPanel(panelId, html) {
    if (panels.has(panelId)) throw new Error(`Overlay panel already exists: ${panelId}`);
    const host = document.createElement('div');
    host.className = 'ft-panel';
    host.dataset.panelId = panelId;
    const shadow = host.attachShadow({ mode: 'open' });
    shadow.innerHTML = html;
    const sizing = document.createElement('style');
    sizing.textContent = ':host,*,*::before,*::after{box-sizing:border-box}';
    shadow.prepend(sizing);
    const sharedStyle = document.querySelector('link[href="/ui-library/game-ui.css"]');
    if (sharedStyle instanceof HTMLLinkElement) shadow.prepend(sharedStyle.cloneNode(true));
    const entry = { host, shadow, listeners: new Map(), app: null, interactive: false, modal: false, layer: 0, dialog: false,
        dragging: false, dragged: false, anchor: null, requestedVisible: false, backdrop: false, backdropColor: null, passThroughOutside: false };
    panels.set(panelId, entry);
    document.body.appendChild(host);
    const observer = new ResizeObserver(reportPresentation);
    observer.observe(host);
    entry.observer = observer;
    shadow.addEventListener('pointerdown', () => { bringToFront(panels, panelId); reportPresentation(); });
    shadow.addEventListener('keydown', e => handlePanelKey(e, entry));
    shadow.addEventListener('click', e => {
        const action = e.target instanceof Element ? e.target.closest('[data-overlay-action]') : null;
        if (!action || !inputPanels(orderedPanels(panels)).includes(entry)) return;
        playSound(panelId, 'button-press');
        window.overlayBus.emit(panelId, 'html.action', { name: action.getAttribute('data-overlay-action') });
    });
    return entry;
}

let lastPresentation = '';
function reportPresentation(force = false) {
    const shown = orderedPanels(panels);
    const receivers = inputPanels(shown);
    shown.forEach((p, index) => {
        p.host.style.zIndex = String(index + 1);
        p.host.style.pointerEvents = receivers.includes(p) ? 'auto' : 'none';
        p.host.inert = !receivers.includes(p);
    });
    const modal = receivers.find(p => p.modal);
    const scrimOwner = shown.findLast(p => p.backdrop);
    backdrop.style.display = scrimOwner ? 'block' : 'none';
    if (scrimOwner) {
        // TODO: replace the neutral default with the approved game scrim color.
        backdrop.style.background = scrimOwner.backdropColor ?? 'rgba(0,0,0,0.3)';
        backdrop.style.zIndex = String(shown.indexOf(scrimOwner) * 2 + 1);
    }
    shown.forEach((p, index) => { p.host.style.zIndex = String(index * 2 + 2); });
    const state = JSON.stringify({
        type: 'presentation-state', visible: shown.length > 0,
        busy: pendingCommands > 0,
        interactive: receivers.length > 0, modal: !!modal,
        passThroughOutside: passesOutsideClicks(shown),
        capturePointer: receivers.some(p => p.dragging),
        regions: receivers.map(p => {
            const r = p.host.getBoundingClientRect();
            return { x: r.x, y: r.y, width: r.width, height: r.height };
        }),
    });
    if (force === true || state !== lastPresentation) {
        lastPresentation = state;
        window.chrome?.webview?.postMessage(state);
    }
}

function hidePanel(entry) {
    entry.requestedVisible = false;
    entry.host.classList.remove('visible');
    entry.dragging = false;
    reportPresentation();
}

function updateAnchor(entry) {
    if (!entry.anchor) return;
    const a = entry.anchor;
    entry.host.classList.toggle('visible', entry.requestedVisible && a.visible !== false);
    if (!entry.requestedVisible || a.visible === false) return;
    const rect = entry.host.getBoundingClientRect();
    const bounds = resolveAnchor(a, { ...physicalViewport, width: innerWidth, height: innerHeight }, rect);
    entry.host.style.transform = 'none';
    entry.host.style.left = bounds.x + 'px';
    entry.host.style.top = bounds.y + 'px';
    if ((a.placement ?? 'cover') === 'cover') {
        entry.host.style.width = bounds.width + 'px'; entry.host.style.height = bounds.height + 'px';
    }
}

function handlePanelKey(e, entry) {
    if (e.defaultPrevented) return;
    const receivers = inputPanels(orderedPanels(panels));
    if (receivers.at(-1) !== entry) return;
    if (e.key === 'Escape' && entry.dialog) {
        const panelId = entry.host.dataset.panelId;
        hidePanel(entry);
        window.overlayBus.emit(panelId, entry.extensionSettings ? 'game-ui.cancel' : 'game-ui.action', { name: 'cancel' });
        e.preventDefault();
    }
    if (e.key === 'Tab' && entry.modal) {
        const items = [...entry.shadow.querySelectorAll('button,input,select,textarea,[tabindex]')]
            .filter(p => !p.disabled && p.tabIndex >= 0 && p.getClientRects().length);
        if (!items.length) { e.preventDefault(); return; }
        const index = items.indexOf(entry.shadow.activeElement);
        items[(index + (e.shiftKey ? -1 : 1) + items.length) % items.length].focus();
        e.preventDefault();
    }
}
document.addEventListener('keydown', e => {
    const top = inputPanels(orderedPanels(panels)).at(-1);
    if (top) handlePanelKey(e, top);
});
function clampPanel(entry) {
    if (!entry.dragged || !entry.host.classList.contains('visible')) return;
    const r = entry.host.getBoundingClientRect();
    entry.host.style.left = Math.max(0, Math.min(innerWidth - r.width, r.left)) + 'px';
    entry.host.style.top = Math.max(0, Math.min(innerHeight - r.height, r.top)) + 'px';
}
window.addEventListener('resize', () => {
    for (const entry of panels.values()) { if (entry.anchor) updateAnchor(entry); else clampPanel(entry); }
    reportPresentation();
});

window.overlayBus = {
    /** Build capabilities are selected by data, independently of a plugin's shared behavior. */
    buildContext: null,
    hasCapability(name) { return this.buildContext?.profile?.capabilities?.includes(name) === true; },
    /**
     * URL of a file inside a package of this launch: an enabled overlay package (path relative to its folder) or an
     * assets package one of them requires (path relative to its `[assets] root`). The launcher serves these read-only,
     * so `<img>`, `fetch()` and CSS `url()` work with the result. Both arguments are validated here and by the launcher.
     * Mounted game UI components receive the same helper through inject('fantasyTalePackages').url.
     * @param {string} packageId  package identifier, 1..96 characters of a-z 0-9 . -
     * @param {string} path       slash-separated relative path without empty, '.' or '..' segments
     * @returns {string}
     */
    packageUrl(packageId, path) {
        if (typeof packageId !== 'string' || !/^[a-z0-9.-]{1,96}$/.test(packageId)) throw new TypeError('Invalid package id.');
        if (typeof path !== 'string' || path.length === 0 || path.length > 1024) throw new TypeError('Invalid package file path.');
        const parts = path.split('/');
        if (parts.some(part => part === '' || part === '.' || part === '..' || part.length > 255 || part.endsWith('.') || part.endsWith(' ')
            || /[\:*?"<>|\x00-\x1f\x7f]/.test(part))) throw new TypeError('Invalid package file path.');
        return 'https://packages.fantasytale.local/' + packageId + '/' + parts.map(encodeURIComponent).join('/');
    },
    /** Shell strings currently ship in zh-CN; other catalog rows remain explicit TODOs. */
    locale: activeLocale,
    translate,
    /** Optional sound provider; unassigned sound cues deliberately remain silent. */
    playSound,
    /**
     * Send an event from a panel's JS to the C# host.
     * @param {string} panelId
     * @param {string} name
     * @param {any}    data
     */
    emit(panelId, name, data = {}) {
        window.chrome.webview.postMessage(
            JSON.stringify({ type: 'event', panelId, name, data }));
    },

    /**
     * Register a handler for events sent from C# to a specific panel.
     * @param {string}   panelId
     * @param {string}   name
     * @param {Function} handler  receives (data, panelId)
     * @returns {Function} Unsubscribe this registration; safe after panel replacement or removal.
     */
    on(panelId, name, handler) {
        return subscribePanel(panels, panelId, name, handler);
    },

    /**
     * The companion channel of the package that owns this panel. Every feature uses the same calls; the package's
     * manifest decides which message types exist here, and the launcher refuses any other.
     *   request(type, version, payload, { timeoutMs }) -> Promise<{ status, response, request_id }>
     *   send(type, version, payload)                  -> Promise<{ status }>
     *   on(type, handler(payload, message))           -> unsubscribe function
     *   onState(handler({ state, capabilities }))     -> unsubscribe function; `state` holds the latest value
     * Mounted game UI components receive the same object through inject('fantasyTaleCompanion').
     * @param {string} panelId
     */
    companion(panelId) {
        const entry = panels.get(panelId);
        if (!entry) throw new Error(`Unknown overlay panel: ${panelId}`);
        if (entry.companion) return entry.companion;
        let next = 0;
        let current = { state: 'unavailable', capabilities: [] };
        const pending = new Map();
        const routes = new Map();
        const watchers = new Set();
        this.on(panelId, 'companion.response', data => {
            const waiting = pending.get(data.id);
            if (!waiting) return;
            pending.delete(data.id);
            clearTimeout(waiting.timer);
            waiting.resolve({ status: data.status, response: data.response ?? null, request_id: data.request_id ?? null });
        });
        this.on(panelId, 'companion.event', data => {
            for (const handler of routes.get(data.type) ?? []) {
                try { handler(data.payload ?? null, data); } catch (error) { console.error(error); }
            }
        });
        this.on(panelId, 'companion.state', data => {
            current = { state: String(data.state ?? 'unavailable'), capabilities: Array.isArray(data.capabilities) ? data.capabilities : [] };
            for (const watcher of watchers) {
                try { watcher(current); } catch (error) { console.error(error); }
            }
        });
        // The launcher answers or the call times out; nothing waits forever and at most 32 calls are open at once.
        const call = (method, type, version, payload, timeoutMs) => new Promise(resolve => {
            if (pending.size >= 32) { resolve({ status: 'busy', response: null, request_id: null }); return; }
            const id = 'r' + (++next);
            const wait = Math.min(Math.max(Number(timeoutMs) || 15000, 100), 300000);
            const timer = setTimeout(() => { pending.delete(id); resolve({ status: 'timeout', response: null, request_id: null }); }, wait + 1000);
            pending.set(id, { resolve, timer });
            this.emit(panelId, 'companion.' + method, { id, type, version, payload: payload ?? null, timeout_ms: Number(timeoutMs) || 0 });
        });
        entry.companion = {
            get state() { return current; },
            onState(handler) { watchers.add(handler); handler(current); return () => watchers.delete(handler); },
            on(type, handler) {
                if (!routes.has(type)) routes.set(type, new Set());
                routes.get(type).add(handler);
                return () => routes.get(type)?.delete(handler);
            },
            request: (type, version, payload, options = {}) => call('request', type, version, payload, options.timeoutMs),
            send: (type, version, payload) => call('send', type, version, payload, 0),
        };
        this.emit(panelId, 'companion.state', {});
        return entry.companion;
    },

    /**
     * Let a panel's own page show, hide, place and configure itself, as the launcher's show/hide/configure/anchor
     * messages do. Options: visible, interactive, modal, backdrop, backdropColor, layer (0..10000), anchor (game-pixel
     * rectangle, see anchors.js, or null to release it).
     * @param {string} panelId
     * @param {object} options
     */
    present(panelId, options = {}) {
        const entry = panels.get(panelId);
        if (!entry) throw new Error(`Unknown overlay panel: ${panelId}`);
        if (Number.isInteger(options.layer) && options.layer >= 0 && options.layer <= 10000) entry.layer = options.layer;
        if (typeof options.interactive === 'boolean') entry.interactive = options.interactive;
        if (typeof options.modal === 'boolean') entry.modal = options.modal;
        if (typeof options.backdrop === 'boolean') entry.backdrop = options.backdrop;
        if (options.backdropColor === null) entry.backdropColor = null;
        else if (typeof options.backdropColor === 'string' && options.backdropColor.length <= 64
            && CSS.supports('color', options.backdropColor)) entry.backdropColor = options.backdropColor;
        if (options.anchor !== undefined) {
            if (!entry.anchor && options.anchor) entry.originalLayout = entry.host.style.cssText;
            entry.anchor = options.anchor;
            if (!options.anchor) entry.host.style.cssText = entry.originalLayout ?? '';
        }
        if (options.visible === true) { entry.requestedVisible = true; entry.host.classList.add('visible'); bringToFront(panels, panelId); }
        else if (options.visible === false) hidePanel(entry);
        else entry.host.classList.toggle('visible', entry.requestedVisible);
        updateAnchor(entry);
        clampPanel(entry);
        reportPresentation();
    },

    /**
     * Load a package's own feature module and mount the component it builds. The module's default export receives
     * { vue, components, theme, locale, panelId, buildContext, companion, packages, present, emit, on } and returns a
     * Vue component; the feature's logic lives in its package, so a new feature needs no launcher change.
     * @param {string} panelId  the package's entry panel, named by its package id
     * @param {string} path     package-relative path of an ES module (.js or .mjs)
     */
    async mountPackageModule(panelId, path) {
        const entry = panels.get(panelId);
        if (!entry) throw new Error(`Unknown overlay panel: ${panelId}`);
        if (typeof path !== 'string' || !/^[A-Za-z0-9_][A-Za-z0-9_./-]{0,127}\.m?js$/.test(path) || path.includes('..'))
            throw new Error('A package module must be a package-relative .js or .mjs path.');
        const { vue, components } = await uiLibrary;
        const module = await import(window.overlayBus.packageUrl(panelId, path));
        if (typeof module.default !== 'function') throw new Error(`Package module ${path} has no default setup function.`);
        const bus = window.overlayBus;
        const component = await module.default({
            vue, components, theme: window.fantasyTaleOverlayTheme, locale: panelLocale, panelId,
            buildContext: bus.buildContext ?? null, companion: bus.companion(panelId), nativeUi: bus.nativeUi(panelId),
            packages: { url: (path, packageId = panelId) => bus.packageUrl(packageId, path) },
            present: options => bus.present(panelId, options),
            emit: (name, data) => bus.emit(panelId, name, data), on: (name, handler) => bus.on(panelId, name, handler),
        });
        if (!component || (typeof component !== 'object' && typeof component !== 'function'))
            throw new Error(`Package module ${path} did not return a component.`);
        return window.overlayBus.mountGameUi(panelId, component, {}, null, { bare: true });
    },

    /**
     * The game's own controls through Game Control Support, for this panel's package. Native first: use the overlay's
     * own drawing only when an operation is unsupported or not ready. Every call resolves:
     *   capabilities()             -> { status, result: { build, operations: [{ kind, supported, ready, features }] } }
     *   invoke(request)            -> { status, result: { operationId, status, buttonId } }  (request as IGameNativeUi)
     *   result(operationId)        -> { status, result }  (reads the outcome; never presents again)
     *   available(kind)            -> true when the kind is supported and ready now
     * status is completed, unavailable (no hook channel), busy, failed or timeout.
     * @param {string} panelId
     */
    nativeUi(panelId) {
        const entry = panels.get(panelId);
        if (!entry) throw new Error(`Unknown overlay panel: ${panelId}`);
        if (entry.nativeUi) return entry.nativeUi;
        let next = 0;
        const pending = new Map();
        this.on(panelId, 'native-ui.response', data => {
            const waiting = pending.get(data.id);
            if (!waiting) return;
            pending.delete(data.id);
            clearTimeout(waiting.timer);
            waiting.resolve({ status: String(data.status ?? 'failed'), result: data.result ?? null });
        });
        const call = (action, fields) => new Promise(resolve => {
            if (pending.size >= 16) { resolve({ status: 'busy', result: null }); return; }
            const id = 'n' + (++next);
            const timer = setTimeout(() => { pending.delete(id); resolve({ status: 'timeout', result: null }); }, 15000);
            pending.set(id, { resolve, timer });
            this.emit(panelId, 'native-ui.request', { id, action, ...fields });
        });
        entry.nativeUi = {
            capabilities: () => call('capabilities', {}),
            invoke: request => call('invoke', { request }),
            result: operationId => call('result', { operation_id: operationId }),
            async available(kind) {
                const reply = await call('capabilities', {});
                return reply.status === 'completed'
                    && (reply.result?.operations ?? []).some(op => op.kind === kind && op.supported && op.ready);
            },
        };
        return entry.nativeUi;
    },

    /** Resolve the optional Vue component library and the selected native theme. */
    loadGameUi() {
        return uiLibrary.then(value => ({ ...value, theme: window.fantasyTaleOverlayTheme }));
    },

    /**
     * Mount one library component into a panel's shadow root. A bare mount (a package's own feature module) gets no
     * shared provider and no wait for a native surface: it supplies its own resources and may draw nothing for a while.
     */
    async mountGameUi(panelId, component, props = {}, target = null, { bare = false } = {}) {
        const entry = panels.get(panelId);
        if (!entry) throw new Error(`Unknown overlay panel: ${panelId}`);
        const { vue, components } = await uiLibrary;
        if (panels.get(panelId) !== entry) return;
        const selected = typeof component === 'string' ? components[component] : component;
        if (!selected) throw new Error(`Unknown game UI component: ${component}`);
        entry.extensionSettings = selected === components.BfExtensionSettings;
        entry.dialog = selected === components.BfMessageBox || selected === components.BfDialog || entry.extensionSettings;
        if (entry.dialog && theme !== 'v3' && Array.isArray(props.buttons)) {
            props = { ...props, buttons: props.buttons.map((button, index) => ({
                ...button, sprite: button.sprite ?? (theme === 'v1'
                    ? `Images/Ui/DialogButton${index === 0 ? 'Ok' : 'Cancel'}-Up.smf`
                    : `Images/Ui/DialogBtn${index === 0 ? 'Ok' : 'Cancel'}.smf`),
            })) };
        }
        const mountPoint = target ? entry.shadow.querySelector(target) : entry.shadow.querySelector('[data-game-ui-root]');
        if (!(mountPoint instanceof HTMLElement)) throw new Error('The panel mount target was not found.');
        entry.app?.unmount();
        entry.uiObserver?.disconnect();
        const surface = bare ? { ready: Promise.resolve(), fail() {} } : waitForNativeSurface(mountPoint);
        const emitComponentEvent = (name, data) => {
            if (panels.get(panelId) !== entry) return;
            if (name === 'action') playSound(panelId, 'button-press');
            if (['action', 'close', 'save', 'cancel'].includes(name) && entry.dialog) hidePanel(entry);
            if (name === 'error') { surface.fail(data); hidePanel(entry); }
            window.overlayBus.emit(panelId, 'game-ui.' + name,
                name === 'error' ? { message: String(data) } : data ?? {});
        };
        const handlers = {
            onAction: data => emitComponentEvent('action', data),
            onChange: data => emitComponentEvent('change', data),
            onClose: data => emitComponentEvent('close', data),
            onSave: data => emitComponentEvent('save', data),
            onCancel: () => emitComponentEvent('cancel'),
            onError: e => emitComponentEvent('error', e),
        };
        entry.app = vue.createApp(bare ? { render: () => vue.h(selected, { ...props, ...handlers }) } : {
            render: () => vue.h(components.BfUiProvider,
                { theme: window.fantasyTaleOverlayTheme, clientDate: window.overlayBus.buildContext?.buildDate?.slice(0, 10), resourceRoot, onError: e => emitComponentEvent('error', e) },
                { default: () => vue.h(selected, { ...props,
                    onAction: data => emitComponentEvent('action', data),
                    onChange: data => emitComponentEvent('change', data),
                    onClose: data => emitComponentEvent('close', data),
                    onSave: data => emitComponentEvent('save', data),
                    onCancel: () => emitComponentEvent('cancel'),
                    onError: e => emitComponentEvent('error', e),
                }) }),
        });
        entry.app.provide('fantasyTaleCompanion', window.overlayBus.companion(panelId));
        entry.app.provide('fantasyTalePackages', { url: (packageId, path) => window.overlayBus.packageUrl(packageId, path) });
        const mounted = entry.app.mount(mountPoint);
        // The resource-backed renderer creates its title bar asynchronously.
        // Observe that creation without polling, then attach the default drag handle.
        entry.uiObserver = new MutationObserver(() => {
            const handle = entry.shadow.querySelector('.bf-window .caption');
            if (handle && !handle.dataset.overlayDrag) {
                handle.dataset.overlayDrag = 'true';
                handle.style.cursor = 'move';
                window.overlayBus.makeDraggable(panelId, handle);
            }
        });
        entry.uiObserver.observe(mountPoint, { childList: true, subtree: true });
        await surface.ready;
        return mounted;
    },

    /**
     * Make the panel host draggable within the game window.
     * The host element should have `pointer-events: none` in its base CSS;
     * the drag handle inside the shadow DOM must set `pointer-events: auto`.
     * @param {string}      panelId
     * @param {HTMLElement} handle   The element inside the shadow DOM that initiates the drag.
     */
    makeDraggable(panelId, handle) {
        const entry = panels.get(panelId);
        if (!entry) return;
        const host = entry.host;
        let startX = 0, startY = 0, startLeft = 0, startTop = 0, dragging = false;

        handle.addEventListener('pointerdown', e => {
            if (e.button !== 0) return;
            // Anchored panels follow their source; dragging the source UI is a
            // locator concern and must not detach the replacement HTML surface.
            if (entry.anchor) return;
            dragging = true;
            entry.dragging = true;
            entry.dragged = true;
            startX = e.clientX;
            startY = e.clientY;
            const bounds = host.getBoundingClientRect();
            startLeft = bounds.left;
            startTop = bounds.top;
            host.style.transform = 'none';
            host.style.left = startLeft + 'px';
            host.style.top = startTop + 'px';
            handle.setPointerCapture(e.pointerId);
            reportPresentation();
            e.preventDefault();
        });

        handle.addEventListener('pointermove', e => {
            if (!dragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            // Clamp within the overlay surface (which is already clamped to the game client area).
            const maxLeft = window.innerWidth  - host.offsetWidth;
            const maxTop  = window.innerHeight - host.offsetHeight;
            host.style.left = Math.max(0, Math.min(maxLeft, startLeft + dx)) + 'px';
            host.style.top  = Math.max(0, Math.min(maxTop,  startTop  + dy)) + 'px';
            reportPresentation();
        });

        const endDrag = () => {
            if (!dragging) return;
            dragging = false;
            entry.dragging = false;
            // Restore click-through so the game receives input again.
            reportPresentation();
        };
        handle.addEventListener('pointerup',     endDrag);
        handle.addEventListener('pointercancel', endDrag);
        handle.addEventListener('lostpointercapture', endDrag);
    },
};

// ── Message handler (C# → page) ──────────────────────────────────────────────

async function handleMessage(e) {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }

    const { type, panelId } = msg;
    if (type === 'build-context') {
        window.overlayBus.buildContext = msg.context;
        for (const id of panels.keys()) window.overlayBus.emit(id, 'game-ui.context', msg.context);
        return;
    }
    if (type === 'viewport') {
        physicalViewport = { pixelWidth: msg.pixelWidth, pixelHeight: msg.pixelHeight };
        for (const entry of panels.values()) if (entry.anchor) updateAnchor(entry);
        reportPresentation();
        return;
    }
    if (!type || !panelId) return;

    switch (type) {
        case 'register': {
            // Publish the entry before loading a package file. This keeps show/hide/send
            // ordered when a file-backed panel arrives immediately after registration.
            const entry = createPanel(panelId, msg.html ?? '');
            entry.layer = Number.isInteger(msg.layer) ? Math.max(0, Math.min(10000, msg.layer)) : 0;
            entry.interactive = msg.interactive === true;
            entry.modal = msg.modal === true;
            entry.passThroughOutside = msg.passThroughOutside === true;
            entry.backdrop = msg.backdrop === true;
            entry.backdropColor = typeof msg.backdropColor === 'string' && msg.backdropColor.length <= 64
                && CSS.supports('color', msg.backdropColor) ? msg.backdropColor : null;
            if (window.overlayBus.buildContext) window.overlayBus.emit(panelId, 'game-ui.context', window.overlayBus.buildContext);

            let html = msg.html ?? '';
            if (!html && msg.fileName) {
                try {
                    const resp = await fetch(`https://overlay.fantasytale.local/${msg.fileName}`);
                    html = resp.ok ? await resp.text() : `<p style="color:red">Failed to load ${msg.fileName}</p>`;
                } catch {
                    html = `<p style="color:red">Error loading ${msg.fileName}</p>`;
                }
            }
            if (msg.fileName && panels.get(panelId) === entry) {
                const content = document.createElement('div');
                content.innerHTML = html;
                entry.shadow.append(content);
            }
            const moduleRoot = entry.shadow.querySelector('[data-game-ui-root][data-game-ui-module]');
            const componentRoot = entry.shadow.querySelector('[data-game-ui-root][data-game-ui-component]');
            if (moduleRoot instanceof HTMLElement) {
                try {
                    await window.overlayBus.mountPackageModule(panelId, moduleRoot.dataset.gameUiModule);
                    window.overlayBus.emit(panelId, 'game-ui.mounted');
                } catch (error) {
                    console.error(error);
                    window.overlayBus.emit(panelId, 'game-ui.error', { message: String(error) });
                }
            } else if (componentRoot instanceof HTMLElement) {
                try {
                    await window.overlayBus.mountGameUi(panelId, componentRoot.dataset.gameUiComponent,
                        JSON.parse(componentRoot.dataset.gameUiProps || '{}'));
                    window.overlayBus.emit(panelId, 'game-ui.mounted');
                } catch (error) {
                    window.overlayBus.emit(panelId, 'game-ui.error', { message: String(error) });
                }
            }
            break;
        }

        case 'unregister': {
            const entry = panels.get(panelId);
            if (entry) { entry.observer.disconnect(); entry.uiObserver?.disconnect(); entry.app?.unmount(); entry.host.remove(); panels.delete(panelId); }
            reportPresentation();
            break;
        }

        case 'show': {
            const entry = panels.get(panelId);
            if (entry) { entry.requestedVisible = true; entry.host.classList.add('visible'); updateAnchor(entry); }
            if (panels.has(panelId)) clampPanel(panels.get(panelId));
            bringToFront(panels, panelId);
            reportPresentation();
            break;
        }

        case 'hide': {
            const entry = panels.get(panelId);
            if (entry) hidePanel(entry);
            break;
        }

        case 'send': {
            const entry = panels.get(panelId);
            if (!entry) break;
            if (msg.name === 'game-ui.bring-to-front') {
                bringToFront(panels, panelId);
                reportPresentation();
                break;
            }
            if (msg.name === 'game-ui.sound') { playSound(panelId, msg.data?.cue); break; }
            if (msg.name === 'game-ui.configure') {
                if (Number.isInteger(msg.data?.layer) && msg.data.layer >= 0 && msg.data.layer <= 10000)
                    entry.layer = msg.data.layer;
                if (typeof msg.data?.interactive === 'boolean') entry.interactive = msg.data.interactive;
                if (typeof msg.data?.modal === 'boolean') entry.modal = msg.data.modal;
                if (typeof msg.data?.passThroughOutside === 'boolean') entry.passThroughOutside = msg.data.passThroughOutside;
                if (typeof msg.data?.backdrop === 'boolean') entry.backdrop = msg.data.backdrop;
                if (msg.data?.backdropColor === null) entry.backdropColor = null;
                else if (typeof msg.data?.backdropColor === 'string' && msg.data.backdropColor.length <= 64
                    && CSS.supports('color', msg.data.backdropColor)) entry.backdropColor = msg.data.backdropColor;
                reportPresentation();
                break;
            }
            if (msg.name === 'game-ui.anchor') {
                if (!entry.anchor && msg.data) entry.originalLayout = entry.host.style.cssText;
                entry.anchor = msg.data;
                if (entry.anchor) updateAnchor(entry);
                else {
                    entry.host.style.cssText = entry.originalLayout ?? '';
                    entry.host.classList.toggle('visible', entry.requestedVisible);
                }
                reportPresentation();
                break;
            }
            if (msg.name === 'html.update') {
                for (const target of entry.shadow.querySelectorAll('[data-overlay-text]')) {
                    const key = target.getAttribute('data-overlay-text');
                    if (Object.hasOwn(msg.data ?? {}, key)) target.textContent = String(msg.data[key] ?? '');
                }
                break;
            }
            if (msg.name === 'game-ui.interactive') {
                entry.interactive = msg.data?.interactive === true;
                reportPresentation();
                break;
            }
            if (msg.name === 'game-ui.message-box') {
                const data = { ...msg.data,
                    title: msg.data?.title ?? translate('dialog.title'),
                    buttons: msg.data?.buttons ?? [{ name: 'ok', label: translate('dialog.confirm') }],
                };
                if (typeof data?.title !== 'string' || typeof data?.text !== 'string'
                    || data.title.length > 256 || data.text.length > 8192
                    || !Array.isArray(data.buttons) || data.buttons.length < 1 || data.buttons.length > 4
                    || data.buttons.some(b => typeof b?.name !== 'string' || !b.name || b.name.length > 64
                        || typeof b?.label !== 'string' || !b.label || b.label.length > 128))
                    throw new Error('Invalid message box options.');
                entry.interactive = true;
                entry.modal = true;
                await window.overlayBus.mountGameUi(panelId, 'BfMessageBox', data);
                entry.requestedVisible = true;
                entry.host.classList.add('visible');
                updateAnchor(entry);
                bringToFront(panels, panelId);
                reportPresentation();
                window.overlayBus.emit(panelId, 'game-ui.mounted');
                playSound(panelId, 'dialog-open');
                break;
            }
            if (msg.name === 'game-ui.mount') {
                try {
                    if (typeof msg.data?.component !== 'string') throw new Error('A game UI component name is required.');
                    await window.overlayBus.mountGameUi(panelId, msg.data.component, msg.data.props ?? {}, msg.data.target ?? null);
                    window.overlayBus.emit(panelId, 'game-ui.mounted');
                } catch (error) {
                    window.overlayBus.emit(panelId, 'game-ui.error', { message: String(error) });
                }
                break;
            }
            const handlers = entry.listeners.get(msg.name);
            handlers?.slice().forEach(h => h(msg.data ?? {}, panelId));
            break;
        }
    }
}

// Keep mount/show/hide ordered even while a component or file is loading.
let commandQueue = Promise.resolve();
let pendingCommands = 0;
window.chrome?.webview?.addEventListener('message', e => {
    if (pendingCommands >= 256) {
        window.chrome.webview.postMessage(JSON.stringify({ type: 'page-error', code: 'queue-full' }));
        return;
    }
    pendingCommands++;
    commandQueue = commandQueue.then(() => handleMessage(e)).catch(error => {
        let panelId;
        try { panelId = JSON.parse(e.data).panelId; } catch { /* Malformed commands have no owner. */ }
        if (typeof panelId === 'string') {
            const entry = panels.get(panelId);
            if (entry) hidePanel(entry);
            window.overlayBus.emit(panelId, 'game-ui.error', { message: String(error) });
        }
    }).finally(() => {
        pendingCommands--; reportPresentation(true);
        try {
            const { wakeId } = JSON.parse(e.data);
            if (Number.isSafeInteger(wakeId)) window.chrome.webview.postMessage(JSON.stringify({type:'command-completed',wakeId}));
        } catch { /* Malformed input is reported by the command error path. */ }
    });
});

// Signal only after the command listener exists, so early startup panels cannot
// be lost between document navigation and module initialization.
await uiLibrary;
window.chrome?.webview?.postMessage(JSON.stringify({ type: 'page-ready' }));
reportPresentation();

// Explicit local preview only; the installed foundation remains visually empty.
if (new URLSearchParams(location.search).get('preview') === 'game-ui') {
    const preview = createPanel('local.game-ui-preview', '<div data-game-ui-root></div>');
    preview.host.style.cssText = 'left:24px;top:24px;pointer-events:none';
    preview.host.classList.add('visible');
    await window.overlayBus.mountGameUi('local.game-ui-preview', 'BfMessageBox', {
        title: 'Fantasy Tale Overlay', text: 'HTML / Vue UI',
        buttons: [{ name: 'Ok', label: 'OK' }],
    });
    reportPresentation();
}
</script>
